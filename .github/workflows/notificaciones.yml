# Notificaciones de Okupa: cada 15 minutos vacía la bandeja de avisos y manda los recordatorios del Diario y los avisos de fechas.
# Necesita el secreto FIREBASE_CUENTA_SERVICIO (ver LEEME.md → Notificaciones). Sin él, termina sin hacer nada.
name: Notificaciones

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: notificaciones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: servidor/notificaciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: servidor/notificaciones/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node enviar.mjs
        env:
          FIREBASE_CUENTA_SERVICIO: ${{ secrets.FIREBASE_CUENTA_SERVICIO }}

    .ok { color: #1b7f3b; }

</head>
<body>
  <div id="resumen">Corriendo…</div>
  <ol id="resultados"></ol>

      './pruebas/progreso.prueba.js',

      './pruebas/portada.prueba.js',
      './pruebas/propio.prueba.js',
      './pruebas/editor.prueba.js',
      './pruebas/pwa.prueba.js',
      './pruebas/precalentar.prueba.js',
      './pruebas/estilos.prueba.js',
      './pruebas/nube-falsa.prueba.js',
      './pruebas/pareja.prueba.js',

      './pruebas/partida.prueba.js',
      './pruebas/sala.prueba.js',
      './pruebas/trivia-pantallas.prueba.js',
      './pruebas/conoces.prueba.js',

      './pruebas/diario-dia.prueba.js',
      './pruebas/diario-aprender.prueba.js',
      './pruebas/diario-pantallas.prueba.js',
      './pruebas/diario-archivo.prueba.js',
      './pruebas/mapa.prueba.js',
      './pruebas/mapa-motor.prueba.js',
      './pruebas/lugares.prueba.js',

      './pruebas/sonidos.prueba.js',
    ];
    const { correr, registrarErrorDeCarga } = await import('./pruebas/corredor.js');
    for (const archivo of archivos) {
      try { await import(archivo); }
      catch (e) { registrarErrorDeCarga(archivo, e); }
    }
    await correr();
  </script>
